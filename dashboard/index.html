<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Routes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5d6573; --line: #e3e6eb;
    --chip: #eef1f5; --warn: #b45309; --danger: #b91c1c; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e8eaee; --muted: #9aa3b2; --line: #2a2f3a;
            --chip: #222733; --warn: #f59e0b; --danger: #f87171; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
          display: flex; flex-direction: column; }
  header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .meta { color: var(--muted); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 20px; }
  .kpi { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
                 padding: 8px 10px; font: inherit; cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--accent); font-weight: 600; }
  .list { padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .driver { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .driver.dim { opacity: .45; }
  .dhead { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .dname { font-weight: 600; flex: 1; }
  .dstats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: var(--chip); }
  .bar i { display: block; height: 100%; }
  .stops { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--line); display: none; }
  .driver.open .stops { display: block; }
  .stops li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 6px 12px; cursor: pointer; }
  .stops li:hover { background: var(--chip); }
  .seq { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700;
         display: grid; place-items: center; }
  .addr { font-size: 13px; }
  .sub { color: var(--muted); font-size: 12px; }
  .eta { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px;
         margin-left: 4px; vertical-align: 1px; }
  .tag.over { color: var(--danger); border: 1px solid var(--danger); }
  .tag.high { color: var(--warn); border: 1px solid var(--warn); }
  .actions { display: flex; gap: 8px; padding: 8px 12px 12px; }
  .actions a, .actions button { font: inherit; font-size: 12px; color: var(--accent); background: none;
         border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; text-decoration: none; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; }
  .loader { padding: 12px 20px; border-top: 1px solid var(--line); margin-top: auto; color: var(--muted); font-size: 12px; }
  .loader label { color: var(--accent); cursor: pointer; }
  #map { height: 100%; }
  .pin { width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 700 11px/24px system-ui;
         text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .depot { width: 28px; height: 28px; border-radius: 6px; background: #16181d; color: #fff;
           font: 700 13px/28px system-ui; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 45vh auto; height: auto; }
    #map { height: 45vh; order: -1; }
    aside { border-right: 0; }
    .kpis { grid-template-columns: repeat(2, 1fr); padding: 12px 16px; }
    header, .tabs, .list, .loader { padding-left: 16px; padding-right: 16px; }
  }
  @media print {
    #map, .tabs, .loader, .actions { display: none; }
    .app { display: block; } .stops { display: block !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Delivery Routes</h1>
      <div class="meta" id="meta">Loading…</div>
    </header>
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
      <button class="on" data-tab="routes">Routes</button>
      <button data-tab="deferred">Deferred <span id="dcount"></span></button>
    </div>
    <div class="list" id="routes"></div>
    <div class="list" id="deferred" hidden></div>
    <div class="loader">Viewing a different plan? <label>Open routes.json<input type="file" accept=".json" id="file" hidden></label></div>
  </aside>
  <div id="map"></div>
</div>
<script>
const COLORS = ["#2563eb", "#d97706", "#059669", "#db2777", "#7c3aed", "#0891b2", "#dc2626", "#65a30d", "#c026d3", "#475569"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;

const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = L.map("map", { zoomControl: true });
L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "light_all"}/{z}/{x}/{y}{r}.png`, {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
}).addTo(map);

let layers = [], markers = {};

function render(data) {
  layers.forEach(l => map.removeLayer(l));
  layers = []; markers = {};
  const s = data.summary;
  document.getElementById("meta").textContent =
    `Plan for ${data.plan_date} · ${data.source} · generated ${data.generated_at.replace("T", " ")}`;
  const maxDur = Math.max(...data.routes.map(r => r.duration_min), 1);
  document.getElementById("kpis").innerHTML = [
    [s.planned, "Stops"], [data.routes.filter(r => r.stops.length).length, "Drivers"],
    [s.total_km.toFixed(0), "Total km"], [s.deferred, "Deferred"]
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

  const depot = L.marker(data.depot, { icon: L.divIcon({ className: "", html: '<div class="depot">D</div>', iconSize: [28, 28] }) })
    .bindPopup("<b>Depot</b>").addTo(map);
  layers.push(depot);
  const bounds = [data.depot];

  const routesEl = document.getElementById("routes");
  routesEl.innerHTML = "";
  data.routes.forEach((r, i) => {
    const color = COLORS[i % COLORS.length];
    const group = L.layerGroup().addTo(map);
    layers.push(group);
    if (r.path.length) L.polyline(r.path, { color, weight: 4, opacity: .85 }).addTo(group);
    r.stops.forEach(st => {
      bounds.push([st.lat, st.lon]);
      const m = L.marker([st.lat, st.lon], {
        icon: L.divIcon({ className: "", html: `<div class="pin" style="background:${color}">${st.seq}</div>`, iconSize: [24, 24] })
      }).bindPopup(`<b>${esc(st.id)}</b> · ${esc(r.driver)} stop ${st.seq}<br>${esc(st.customer)}<br>${esc(st.address)} ${esc(st.zone)}
        <br>${st.qty} pkg · ETA +${fmtMin(st.eta_min)}${st.due ? ` · due ${st.due}` : ""}`).addTo(group);
      markers[`${i}-${st.seq}`] = m;
    });

    const card = document.createElement("div");
    card.className = "driver" + (i === 0 ? " open" : "");
    card.innerHTML = `
      <div class="dhead">
        <span class="swatch" style="background:${color}"></span>
        <span class="dname">${esc(r.driver)}</span>
        <span class="dstats">${r.stops.length} stops · ${r.distance_km.toFixed(1)} km · ${fmtMin(r.duration_min)}</span>
      </div>
      <div class="bar" title="Route time relative to longest route"><i style="width:${r.duration_min / maxDur * 100}%;background:${color}"></i></div>
      <ul class="stops">${r.stops.map(st => `
        <li data-key="${i}-${st.seq}">
          <span class="seq" style="background:${color}">${st.seq}</span>
          <span><div class="addr">${esc(st.address || st.id)}${st.overdue ? '<span class="tag over">OVERDUE</span>' : ""}${st.priority === 1 ? '<span class="tag high">HIGH</span>' : ""}</div>
            <div class="sub">${esc(st.id)} · ${esc(st.customer)} · ${st.qty} pkg</div></span>
          <span class="eta">+${fmtMin(st.eta_min)}<br>${st.leg_km} km</span>
        </li>`).join("") || '<li class="sub">No stops assigned</li>'}
      </ul>
      ${r.stops.length ? `<div class="actions">
        <a href="${esc(r.maps_url)}" target="_blank" rel="noopener">Open in Google Maps${r.stops.length > 9 ? " (first 9)" : ""}</a>
        <button data-solo>Show only this route</button>
      </div><div class="sub" style="padding:0 12px 10px">Load ${r.load} · ${esc(r.method)}</div>` : ""}`;
    card.querySelector(".dhead").onclick = () => card.classList.toggle("open");
    card.querySelectorAll("li[data-key]").forEach(li => li.onclick = () => {
      const m = markers[li.dataset.key];
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup();
    });
    const solo = card.querySelector("[data-solo]");
    if (solo) solo.onclick = () => {
      const isSolo = card.dataset.solo === "1";
      document.querySelectorAll(".driver").forEach((c, j) => {
        const show = isSolo || j === i;
        c.classList.toggle("dim", !show); c.dataset.solo = "";
        const g = layers[j + 1]; show ? map.addLayer(g) : map.removeLayer(g);
      });
      card.dataset.solo = isSolo ? "" : "1";
      solo.textContent = isSolo ? "Show only this route" : "Show all routes";
      if (!isSolo && r.path.length) map.fitBounds(r.path, { padding: [30, 30] });
    };
    routesEl.appendChild(card);
  });
  map.fitBounds(bounds, { padding: [30, 30] });

  document.getElementById("dcount").textContent = `(${data.deferred.length})`;
  document.getElementById("deferred").innerHTML = data.deferred.length ? `
    <table><thead><tr><th>Order</th><th>Address</th><th>Due</th><th>Why deferred</th></tr></thead><tbody>
    ${data.deferred.map(d => `<tr><td>${esc(d.id)}</td><td>${esc(d.address)}</td><td>${esc(d.due || "—")}</td><td>${esc(d.reason)}</td></tr>`).join("")}
    </tbody></table>` : '<div class="empty">Nothing deferred — every open delivery is on a route.</div>';
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("routes").hidden = b.dataset.tab !== "routes";
  document.getElementById("deferred").hidden = b.dataset.tab !== "deferred";
});
document.getElementById("file").onchange = e => {
  const f = e.target.files[0];
  if (f) f.text().then(t => render(JSON.parse(t))).catch(err => alert("Could not read file: " + err));
};
fetch("routes.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => document.getElementById("meta").textContent = "No routes.json found — run route_planner.py, or open a file below.");
</script>
</body>
</html>
